<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Portfolio Contact Form</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:20px 0;">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">

                    <!-- Header -->
                    <tr>
                        <td align="center"
                            style="background:linear-gradient(90deg,#1e90ff,#00c9a7);
                                   padding:40px 20px;
                                   color:white;">
                            <h1 style="margin:0;">New Contact Form Message</h1>
                            <p style="margin-top:10px;">
                                You have received a new message from your portfolio website
                            </p>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding:30px;">

                            <div style="
                                border-left:4px solid #1e90ff;
                                background:#f8f9fa;
                                padding:20px;
                                margin-bottom:25px;
                            ">
                                <h4 style="margin:0;color:#666;">FROM</h4>

                                <p style="
                                    margin:10px 0 5px 0;
                                    font-size:18px;
                                    font-weight:bold;
                                ">
                                    {{name}}
                                </p>

                                <p style="
                                    margin:0;
                                    color:#1e90ff;
                                ">
                                    {{email}}
                                </p>
                            </div>

                            <h4 style="color:#666;">MESSAGE</h4>

                            <div style="
                                border:1px solid #e0e0e0;
                                padding:20px;
                                min-height:120px;
                                background:#fff;
                            ">
                                {{message}}
                            </div>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding:20px 30px 40px;">

                            <a href="mailto:{{email}}"
                               style="
                                    background:#1e90ff;
                                    color:white;
                                    text-decoration:none;
                                    padding:12px 30px;
                                    border-radius:5px;
                                    display:inline-block;
                                    font-weight:bold;
                               ">
                                Reply to {{name}}
                            </a>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
